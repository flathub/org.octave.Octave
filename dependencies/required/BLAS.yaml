# References:
# https://github.com/gnu-octave/docker/blob/main/build-octave-11.docker
# https://www.openmathlib.org/OpenBLAS/docs/build_system/
# https://www.openmathlib.org/OpenBLAS/docs/distributing/
name: openblas
buildsystem: autotools
no-autogen: true
builddir: true
build-options:
  env:
    - BUILD_SHARED_LIBS: 1
    - BINARY: 64
    - INTERFACE64: 1
    - DYNAMIC_ARCH: 1
    - DYNAMIC_OLDER: 1
    - TARGET: GENERIC
    - CONSISTENT_FPCSR: 1
    - USE_THREAD: 1
    - USE_OPENMP: 1
    - NUM_THREADS: 256
make-install-args:
  - PREFIX=/app
post-install:
  - "ln -s /app/lib/libopenblas.so /app/lib/libopenblas64.so"
sources:
  - type: git
    url: https://github.com/OpenMathLib/OpenBLAS
    commit: 62bcfb0dc9f1cfa685fc04135c50e2780c303137
    tag: v0.3.33
    x-checker-data:
      type: anitya
      project-id: 2540
      tag-template: v$version
