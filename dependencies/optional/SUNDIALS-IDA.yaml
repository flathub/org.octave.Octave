# References:
# https://github.com/gnu-octave/docker/blob/main/build-octave-11.docker
name: sundials
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DEXAMPLES_ENABLE_C=OFF                      \
  - -DENABLE_KLU=ON
  - -DKLU_INCLUDE_DIR:PATH=/app/include/suitesparse
  - -DKLU_LIBRARY_DIR:PATH=/app/lib
  - -DBUILD_ARKODE=OFF                           
  - -DBUILD_CVODE=OFF                            
  - -DBUILD_CVODES=OFF                           
  - -DBUILD_IDA=ON                               
  - -DBUILD_IDAS=OFF                             
  - -DBUILD_KINSOL=OFF                           
  - -DBUILD_CPODES=OFF 
builddir: true
sources:
  - type: git
    url: https://github.com/LLNL/sundials
    commit: 0a1024b7fb902a5eae3142adf8c13561c6989543
    tag: v7.7.0
    x-checker-data:
      type: git
      tag-pattern: ^v([\d.]+)$