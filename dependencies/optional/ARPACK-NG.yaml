# References:
# https://github.com/gnu-octave/docker/blob/main/build-octave-11.docker
name: arpack-ng
buildsystem: autotools
builddir: true
config-opts:
  - --prefix=/app
  - --libdir=/app/lib
  - --with-blas='-lopenblas'
  - --with-lpack=''
build-options:
  env:
    - FFLAGS: -fallow-argument-mismatch
    - FCFLAGS: -fallow-argument-mismatch
    - INTERFACE64: 1
sources:
  - type: git
    url: https://github.com/opencollab/arpack-ng
    commit: 40329031ae8deb7c1e26baf8353fa384fc37c251
    tag: 3.9.1
    x-checker-data:
      type: git
      tag-pattern: ^([\d.]+)$